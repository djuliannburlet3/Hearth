<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Animation - Code Exact</title>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Arial', sans-serif;
        }
        #title {
            position: absolute;
            top: 10%;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 32px;
            font-style: italic;
            font-weight: bold;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="title">Heart Animation</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // === LE CODE DE TON IMAGE (Lignes 1 à 21) ===
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            5000
        );

        camera.position.z = 500; // Ajusté à 500 comme sur ton écran

        const renderer = new THREE.WebGLRenderer();

        renderer.setPixelRatio(
            window.devicePixelRatio > 1 ? 2 : 1
        );

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        // === FIN DE TON IMAGE & SUITE LOGIQUE DU CODE ===
        
        // On injecte le rendu dans la page web
        document.body.appendChild(renderer.domElement);

        // Gestion de la souris (Création de l'interaction de rotation)
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        
        // Variables pour stocker la rotation du cœur
        let rotationX = 0;
        let rotationY = 0;

        window.addEventListener('mousedown', (e) => {
            isDragging = true;
        });

        window.addEventListener('mousemove', (e) => {
            const deltaMove = {
                x: e.clientX - previousMousePosition.x,
                y: e.clientY - previousMousePosition.y
            };

            if (isDragging) {
                // On fait tourner le groupe complet contenant le cœur
                rotationY += deltaMove.x * 0.005;
                rotationX += deltaMove.y * 0.005;
            }

            previousMousePosition = {
                x: e.clientX,
                y: e.clientY
            };
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Génération du cœur de particules (adapté à l'échelle z = 500)
        const particleCount = 25000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            const t = Math.random() * Math.PI * 2;
            
            // Équation mathématique du cœur multipliée par 15 pour être visible à une distance de 500
            const x = 15 * (16 * Math.pow(Math.sin(t), 3));
            const y = 15 * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            const z = (Math.random() - 0.5) * 50; // Épaisseur en 3D

            // Dispersion (bruit) pour l'effet "nuage de paillettes" de la vidéo
            const noise = 20;
            positions[i * 3] = x + (Math.random() - 0.5) * noise;
            positions[i * 3 + 1] = y + (Math.random() - 0.5) * noise;
            positions[i * 3 + 2] = z + (Math.random() - 0.5) * noise;

            // Dégradé de couleurs roses et fushias scintillantes
            colors[i * 3] = 0.9 + Math.random() * 0.1;     // R
            colors[i * 3 + 1] = 0.15 + Math.random() * 0.3; // V
            colors[i * 3 + 2] = 0.55 + Math.random() * 0.3; // B
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // Style visuel des particules (Brillance et transparence)
        const material = new THREE.PointsMaterial({
            size: 3.5, // Taille des points adaptée à la distance
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending // Effet néon / lumineux
        });

        const heartPoints = new THREE.Points(geometry, material);
        scene.add(heartPoints);

        // Boucle d'animation principale (Rendu + Effets de mouvement)
        function animate() {
            requestAnimationFrame(animate);

            // On applique la rotation à la souris
            heartPoints.rotation.x = rotationX;
            heartPoints.rotation.y = rotationY;

            // Effet automatique de pulsation (battement de cœur)
            const time = Date.now() * 0.001;
            const scale = 1 + Math.sin(time * 4) * 0.04;
            heartPoints.scale.set(scale, scale, scale);

            renderer.render(scene, camera);
        }

        animate();

        // Réajustement automatique si on change la taille de la fenêtre
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

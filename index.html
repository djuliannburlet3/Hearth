<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Animation - Dessin Progressif</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background-color: #000000;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            5000
        );
        camera.position.z = 25; // Zoom adapté pour le rendu à plat

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio > 1 ? 2 : 1);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- CONFIGURATION DES PARTICULES ---
        const numParticles = 40000; 
        const positions = new Float32Array(numParticles * 3);
        const colors = new Float32Array(numParticles * 3);
        const baseColor = new THREE.Color("#ff4d79"); 

        // Tri et génération des particules pour qu'elles se dessinent dans l'ordre (du bas vers le haut)
        const pointsData = [];

        for (let i = 0; i < numParticles; i++) {
            // t va de -PI à PI pour parcourir le cœur
            const t = Math.PI * (Math.random() * 2 - 1);

            // Équations mathématiques du cœur en 2D
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            
            // On garde un très léger Z pour la superposition, mais pas de volume 3D
            const z = (Math.random() - 0.5) * 0.5; 

            // Ajout d'une dispersion (bruit) autour de la ligne du cœur
            const noise = 1.5;
            const finalX = x * 0.7 + (Math.random() - 0.5) * noise;
            const finalY = y * 0.7 + (Math.random() - 0.5) * noise;
            const finalZ = z;

            pointsData.push({ x: finalX, y: finalY, z: finalZ, t: t });
        }

        // On trie les points selon l'angle 't' pour que l'animation dessine les courbes de manière fluide
        pointsData.sort((a, b) => a.t - b.t);

        // Remplissage des tableaux de géométrie avec les données triées
        for (let i = 0; i < numParticles; i++) {
            positions[i * 3] = pointsData[i].x;
            positions[i * 3 + 1] = pointsData[i].y;
            positions[i * 3 + 2] = pointsData[i].z;

            colors[i * 3] = baseColor.r + (Math.random() - 0.5) * 0.1;
            colors[i * 3 + 1] = baseColor.g + (Math.random() - 0.5) * 0.1;
            colors[i * 3 + 2] = baseColor.b + (Math.random() - 0.5) * 0.1;
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // Texture floue pour les points lumineux
        const canvasTexture = document.createElement('canvas');
        canvasTexture.width = 16; 
        canvasTexture.height = 16;
        const ctx = canvasTexture.getContext('2d');
        const gradient = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = gradient; 
        ctx.fillRect(0, 0, 16, 16);
        const particleTexture = new THREE.CanvasTexture(canvasTexture);

        const material = new THREE.PointsMaterial({
            size: 0.25,
            vertexColors: true,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            map: particleTexture
        });

        const heart = new THREE.Points(geometry, material);
        scene.add(heart);

        // --- ANIMATION D'APPARITION (SANS ROTATION) ---
        let currentDrawCount = 0;
        const growthSpeed = 250; // Vitesse d'apparition (nombre de points par frame)

        function animate() {
            requestAnimationFrame(animate);

            // Fait apparaître le tracé du cœur progressivement
            if (currentDrawCount < numParticles) {
                currentDrawCount += growthSpeed;
                if (currentDrawCount > numParticles) currentDrawCount = numParticles;
                geometry.setDrawRange(0, currentDrawCount);
            }

            // AUCUNE ROTATION ICI : L'objet reste fixe face à la caméra

            renderer.render(scene, camera);
        }

        animate();

        // Redimensionnement de l'écran
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

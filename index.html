<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player - Tout-en-un</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- 2. STYLE CSS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
        }

        .player {
            background: #fff;
            padding: 25px 30px;
            border-radius: 20px;
            text-align: center;
            width: 320px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .cover {
            width: 150px;
            height: 150px;
            border-radius: 15px;
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            background-color: #eee; /* Fond de secours si pas d'image */
        }

        h2 {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h3 {
            font-size: 20px;
            color: #333;
            margin: 5px 0;
        }

        p {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .controls button {
            background: none;
            border: none;
            color: #1e3c72;
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .controls button#play {
            font-size: 35px;
            color: #2a5298;
        }

        .controls button:hover {
            transform: scale(1.1);
        }

        .progress, .volume {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: #2a5298;
        }

        .volume i {
            color: #666;
            width: 20px;
        }
    </style>
</head>
<body>

    <div class="player">
        <img src="images/cover.jpg" class="cover" alt="Cover Art">
        <h2>Now Playing</h2>
        <h3 id="title">Song Title</h3>
        <p id="artist">Artist Name</p>

        <audio id="audio"></audio>

        <div class="controls">
            <button id="prev"><i class="fas fa-backward"></i></button>
            <button id="play"><i class="fas fa-play"></i></button>
            <button id="next"><i class="fas fa-forward"></i></button>
        </div>

        <div class="progress">
            <input type="range" id="progress" value="0" min="0" max="100">
        </div>

        <div class="volume">
            <i class="fas fa-volume-up" id="vol-icon"></i>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
        </div>
    </div>

    <script>
        const audio = document.getElementById("audio");
        const title = document.getElementById("title");
        const artist = document.getElementById("artist");
        const playBtn = document.getElementById("play");
        const prevBtn = document.getElementById("prev");
        const nextBtn = document.getElementById("next");
        const progress = document.getElementById("progress");
        const volume = document.getElementById("volume");

        // Liste des pistes musicales (Modifie les chemins si nécessaire)
        const songs = [
            { name: "Song Title 1", artist: "Artist 1", src: "songs/song1.mp3" },
            { name: "Song Title 2", artist: "Artist 2", src: "songs/song2.mp3" }
        ];

        let songIndex = 0;
        let isPlaying = false;

        // Charger une chanson
        function loadSong(index) {
            title.textContent = songs[index].name;
            artist.textContent = songs[index].artist;
            audio.src = songs[index].src;
        }

        // Lancer la lecture
        function playSong() {
            audio.play();
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            isPlaying = true;
        }

        // Mettre en pause
        function pauseSong() {
            audio.pause();
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            isPlaying = false;
        }

        // Chanson suivante
        function nextSong() {
            songIndex = (songIndex + 1) % songs.length;
            loadSong(songIndex);
            if (isPlaying) playSong();
        }

        // Chanson précédente
        function prevSong() {
            songIndex = (songIndex - 1 + songs.length) % songs.length;
            loadSong(songIndex);
            if (isPlaying) playSong();
        }

        // Événements boutons de contrôle
        playBtn.addEventListener("click", () => {
            isPlaying ? pauseSong() : playSong();
        });

        nextBtn.addEventListener("click", nextSong);
        prevBtn.addEventListener("click", prevSong);

        // Faire avancer la barre de progression avec le temps de la chanson
        audio.addEventListener("timeupdate", () => {
            if (audio.duration) {
                progress.value = (audio.currentTime / audio.duration) * 100;
            }
        });

        // Changer le moment de la chanson en déplaçant le curseur
        progress.addEventListener("input", () => {
            if (audio.duration) {
                audio.currentTime = (progress.value / 100) * audio.duration;
            }
        });

        // Changer le volume du lecteur
        volume.addEventListener("input", () => {
            audio.volume = volume.value;
            // Optionnel : Changer l'icône si le son est coupé
            const volIcon = document.getElementById("vol-icon");
            if (audio.volume === 0) {
                volIcon.className = "fas fa-volume-mute";
            } else if (audio.volume < 0.5) {
                volIcon.className = "fas fa-volume-down";
            } else {
                volIcon.className = "fas fa-volume-up";
            }
        });

        // Lancer le chargement du premier morceau au chargement de la page
        loadSong(songIndex);
    </script>
</body>
</html>

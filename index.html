<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cœur 3D interactif</title>
<style>
    body{
        margin:0;
        overflow:hidden;
        background:#111;
    }

    canvas{
        display:block;
    }

    #info{
        position:absolute;
        top:15px;
        width:100%;
        text-align:center;
        color:white;
        font-family:Arial;
        pointer-events:none;
        font-size:18px;
    }
</style>
</head>
<body>

<div id="info">
🖱 Clique et glisse pour tourner • Molette pour zoomer
</div>

<script type="module">

import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(
45,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(0,2,8);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// Lumières
scene.add(new THREE.AmbientLight(0xffffff,1));

const light1=new THREE.DirectionalLight(0xffffff,2);
light1.position.set(5,5,5);
scene.add(light1);

const light2=new THREE.DirectionalLight(0xff6688,1.5);
light2.position.set(-5,-3,-4);
scene.add(light2);

// Forme du cœur
const x=0,y=0;

const heartShape=new THREE.Shape();

heartShape.moveTo(x+0,y+0);

heartShape.bezierCurveTo(x+0,y+0,x-2,y-2,x-2,y+1);

heartShape.bezierCurveTo(x-2,y+3,x,y+5,x,y+6);

heartShape.bezierCurveTo(x,y+5,x+2,y+3,x+2,y+1);

heartShape.bezierCurveTo(x+2,y-2,x+0,y+0,x+0,y+0);

const extrudeSettings={
    depth:1.2,
    bevelEnabled:true,
    bevelSegments:20,
    steps:2,
    bevelSize:0.35,
    bevelThickness:0.35,
    curveSegments:100
};

const geometry=new THREE.ExtrudeGeometry(
heartShape,
extrudeSettings
);

geometry.center();

const material=new THREE.MeshPhysicalMaterial({

    color:0xff3366,
    metalness:0.15,
    roughness:0.2,
    clearcoat:1,
    clearcoatRoughness:0,

});

const heart=new THREE.Mesh(geometry,material);

heart.rotation.x=Math.PI;
heart.rotation.z=Math.PI;

scene.add(heart);

// Contrôles souris
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=0.06;
controls.autoRotate=false;

// Animation
function animate(){

requestAnimationFrame(animate);

controls.update();

renderer.render(scene,camera);

}

animate();

window.addEventListener("resize",()=>{

camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();

renderer.setSize(window.innerWidth,window.innerHeight);

});

</script>

</body>
</html>

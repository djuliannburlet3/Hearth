<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Animation Interactive - Three.js</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Arial', sans-serif;
            user-select: none;
        }
        #title {
            position: absolute;
            top: 10%;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 32px;
            font-style: italic;
            font-weight: bold;
            letter-spacing: 2px;
            pointer-events: none; /* Permet de cliquer à travers le texte */
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="title">Heart Animation</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Initialisation de la Scène et de la Caméra
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            5000
        );
        camera.position.z = 35; 

        // Initialisation du Rendu (Renderer)
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio > 1 ? 2 : 1);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // AJOUT : Configuration des contrôles de la souris
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // Ajoute un effet d'inertie fluide
        controls.dampingFactor = 0.05;
        controls.enableZoom = true;    // Permet de zoomer avec la molette

        // Création des particules du Cœur
        const particleCount = 20000; // Augmenté un peu pour densifier la 3D
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            const t = Math.random() * Math.PI * 2;
            
            // Équation de base du cœur en 2D
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            
            // On donne un peu plus de volume en Z (profondeur) pour que ce soit joli quand on tourne autour
            const z = (Math.random() - 0.5) * 4; 

            // Dispersion (bruit) pour l'effet nuage de paillettes
            const noise = 1.5;
            positions[i * 3] = x + (Math.random() - 0.5) * noise;
            positions[i * 3 + 1] = y + (Math.random() - 0.5) * noise;
            positions[i * 3 + 2] = z + (Math.random() - 0.5) * noise;

            // Couleurs dégradées de rose / fushia scintillantes
            colors[i * 3] = 0.9 + Math.random() * 0.1;     // R
            colors[i * 3 + 1] = 0.15 + Math.random() * 0.35; // V
            colors[i * 3 + 2] = 0.55 + Math.random() * 0.35; // B
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // Matériau des particules
        const material = new THREE.PointsMaterial({
            size: 0.25,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending
        });

        const heartPoints = new THREE.Points(geometry, material);
        scene.add(heartPoints);

        // Boucle d'animation
        function animate() {
            requestAnimationFrame(animate);

            // Met à jour les contrôles de la souris à chaque image
            controls.update();

            // Effet automatique de pulsation (battement)
            const time = Date.now() * 0.001;
            const scale = 1 + Math.sin(time * 4) * 0.05;
            heartPoints.scale.set(scale, scale, scale);

            renderer.render(scene, camera);
        }

        animate();

        // Gestion du redimensionnement de la fenêtre
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
